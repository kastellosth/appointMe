spring:
  application:
    name: appointme
  datasource:
    url: jdbc:postgresql://localhost:5432/appointme
    username: appointme
    password: appointme
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  task:
    scheduling:
      pool:
        size: 2
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    tags-sorter: alpha
    persist-authorization: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    ttl-minutes: 30