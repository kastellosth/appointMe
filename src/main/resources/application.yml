spring:
  application:
    name: appointme
  datasource:
    url: jdbc:postgresql://localhost:5432/appointme
    username: appointme
    password: appointme
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    ttl-minutes: 30